<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" href="/Service/assets/apple-touch-icon.png">
  <link rel="icon" href="/Service/assets/favicon.ico">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Field Docs">
  <title>{{ page.title }}</title>
  <style>
  body {
    font-family: -apple-system, system-ui, sans-serif;
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
    line-height: 1.6;
    color: #222;
    background: #fff;
  }
  h1, h2, h3 { color: #111; }
  code, pre {
    background: #f4f4f4;
    padding: 2px 6px;
    border-radius: 4px;
  }
  a { color: #0066cc; }

  @media (prefers-color-scheme: dark) {
    body {
      background: #1a1a1a;
      color: #e0e0e0;
    }
    h1, h2, h3 { color: #ffffff; }
    code, pre {
      background: #2d2d2d;
      color: #e0e0e0;
    }
    a { color: #6db3f2; }
  }
</style>
</head>
<body>
  {{ content }}
</body>
</html>
