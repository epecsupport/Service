<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" href="/Service/assets/apple-icon-precomposed.png">
  <link rel="icon" href="/Service/assets/favicon.ico">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Field Docs">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="build-time" content="{{ site.time | date: '%s' }}">
  <title>{{ page.title }}</title>
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 10px;
      line-height: 1.6;
      color: #222;
      background: #fff;
    }
    h1, h2, h3 { color: #111; }
    code, pre {
      background: #f4f4f4;
      padding: 2px 6px;
      border-radius: 4px;
    }
    a { color: #0066cc; }

    @media (prefers-color-scheme: dark) {
      body {
        background: #1a1a1a;
        color: #e0e0e0;
      }
      h1, h2, h3 { color: #ffffff; }
      code, pre {
        background: #2d2d2d;
        color: #e0e0e0;
      }
      a { color: #6db3f2; }
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background: #f0f0f0;
      font-weight: 600;
    }

    @media (prefers-color-scheme: dark) {
      th, td { border-color: #444; }
      th { background: #2d2d2d; }
    }

    mark, .highlight {
      background: #fff3a3;
      color: #222;
      padding: 1px 4px;
      border-radius: 3px;
    }
    .warning { color: #b35900; font-weight: 600; }
    .danger { color: #cc0000; font-weight: 600; }
    .note { color: #0066cc; font-style: italic; }

    @media (prefers-color-scheme: dark) {
      mark, .highlight {
        background: #665c00;
        color: #fff3a3;
      }
      .warning { color: #ffb366; }
      .danger { color: #ff6b6b; }
      .note { color: #6db3f2; }
    }
  </style>
</head>
<body>
  {{ content }}

  <script>
    document.querySelectorAll('a[href^="http"]').forEach(link => {
      if (!link.href.includes(window.location.hostname)) {
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
      }
    });
  </script>

  {% if page.autolink %}
  <script>
    function autoLinkPage(root) {
      const combined = /([\w.+-]+@[\w-]+\.[\w.-]+)|(\(?\d{3}\)?[-.\s]\d{3}[-.\s]\d{4})|(https?:\/\/[^\s<>"')\]]+)/g;
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (node.parentElement.closest('a, script, style')) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      const nodes = [];
      let n;
      while (n = walker.nextNode()) nodes.push(n);

      nodes.forEach(node => {
        const text = node.nodeValue;
        combined.lastIndex = 0;
        if (!combined.test(text)) return;
        combined.lastIndex = 0;

        const frag = document.createDocumentFragment();
        let lastIndex = 0, match;
        while (match = combined.exec(text)) {
          frag.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
          const a = document.createElement('a');
          if (match[1]) {
            a.href = 'mailto:' + match[1];
          } else if (match[2]) {
            a.href = 'tel:' + match[2].replace(/\D/g, '');
          } else {
            a.href = match[3];
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
          }
          a.textContent = match[0];
          frag.appendChild(a);
          lastIndex = combined.lastIndex;
        }
        frag.appendChild(document.createTextNode(text.slice(lastIndex)));
        node.parentNode.replaceChild(frag, node);
      });
    }
    autoLinkPage(document.body);
  </script>
  {% endif %}

  <script>
    (async () => {
      try {
        const current = document.querySelector('meta[name="build-time"]').content;
        const res = await fetch(window.location.pathname + '?_=' + Date.now(), { cache: 'no-store' });
        const html = await res.text();
        const match = html.match(/<meta name="build-time" content="(\d+)">/);
        if (match && match[1] !== current) {
          window.location.reload();
        }
      } catch (e) {
        // offline or no signal — just keep showing what's already loaded
      }
    })();
  </script>
</body>
</html>
